name: Nef_3_benchmark

on:
  push:
    branches: [ google-benchmark ]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Install Dependencies
      run: sudo apt-get install -y libboost-dev libboost-thread-dev libgmp-dev libmpfr-dev libpfm4-dev
    - name: Install Python Dependencies
      run: sudo python -m pip install scipy
    - name: Checkout benchmark
      uses: actions/checkout@v3
      with:
        repository: google/benchmark
        path: benchmark
    - name: Build benchmark
      run: |
        pushd benchmark;
        cmake -DBENCHMARK_ENABLE_LIBPFM=ON -DBENCHMARK_INSTALL_TOOLS=ON -DBENCHMARK_ENABLE_GTEST_TESTS=OFF -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release -B build;
        cmake --build build;
        sudo cmake --install build;
        popd;
    - name: Checkout CGAL
      uses: actions/checkout@v3
      with:
        repository: CGAL/cgal
        path: cgal
    - name: Install CGAL
      run: |
        pushd cgal;
        mkdir build;
        pushd build;
        cmake -DWITH_CGAL_Qt6=ON -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release ..;
        sudo make install;
        popd;
        popd;
    - name: Configure baseline
      run: cmake -DCMAKE_BUILD_TYPE=Release .
    - name: Build baseline
      run: |
        make;
        mv ./benchmarks ./baseline;
        make clean;
    - name: Install CGAL contender
      run: |
        pushd cgal;
        git remote add giles https://github.com/GilesBathgate/cgal.git;
        git fetch giles;
        git checkout Property_map-performance_unordered_flat_map-GilesBathgate;
        pushd build;
        cmake -DWITH_CGAL_Qt6=ON -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release ..;
        sudo make install;
        popd;
        popd;
    - name: Configure contender
      run: cmake -DCMAKE_BUILD_TYPE=Release .
    - name: Build contender
      run: |
        make;
        mv ./benchmarks ./contender;
        make clean;
    - name: Test
      run: |
        python /usr/share/googlebenchmark/tools/compare.py benchmarks ./baseline ./contender --benchmark_repetitions=10 | tee ./benchmark_results.txt;
        sed 's/\x1b\[[0-9;]*m//g' -i ./benchmark_results.txt;
    - name: Store results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark_results
        path: ./benchmark_results.txt

